name: {{ cookiecutter.repo_name }}-staging

services:
  app:
    container_name: {{ cookiecutter.repo_name }}_staging
    build:
      context: .
      dockerfile: compose/app/Dockerfile.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-{{ cookiecutter.staging_port }}}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS}
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      STATIC_ROOT: /app/static
      MEDIA_ROOT: /app/media
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    volumes:
      - {{ cookiecutter.repo_name | replace('-', '_') }}_staging_db:/var/lib/postgresql/data
      - {{ cookiecutter.repo_name | replace('-', '_') }}_staging_media:/app/media

volumes:
  {{ cookiecutter.repo_name | replace('-', '_') }}_staging_db:
  {{ cookiecutter.repo_name | replace('-', '_') }}_staging_media:
