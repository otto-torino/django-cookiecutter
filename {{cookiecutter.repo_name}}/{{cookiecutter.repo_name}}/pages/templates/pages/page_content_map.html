{% raw %}<div class="{% if obj.background_color %}px-4 py-4{% else %}py-2{% endif %} rounded-lg" style="background-color: {{ obj.background_color }}">
    {% if obj.show_name %}<h2 class="text-2xl text-corange mb-4">{{ obj.name }}</h2>{% endif %}
    {{ obj.text|safe }}
    <div class="mt-6" id="map{{ obj.id }}" style="height: {{ obj.height }}px;"></div>
    <script>
        (function () {
            var map = L.map('map{{ obj.id }}', {
                fullscreenControl: {
                    pseudoFullscreen: false
                }
            }).setView([45,7], 8);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
    
            let coords;
            let shape;
            let markerHtmlStyles;
            let icon;

            const bounds = L.latLngBounds();
            {% for item in obj.items.all %}
                {% if item.shape == 'POINT' %}
                    coords = {{ item.coordinates | safe }};
                    markerHtmlStyles = `
                      background-color: {{ item.color }};
                      width: 2rem;
                      height: 2rem;
                      display: block;
                      left: -1rem;
                      top: -1rem;
                      position: relative;
                      border-radius: 2rem 2rem 0;
                      transform: rotate(45deg);
                      border: 1px solid #FFFFFF`
                    icon = L.divIcon({
                      iconAnchor: [0, 24],
                      labelAnchor: [-6, 0],
                      popupAnchor: [0, -40],
                      html: `<span style="${markerHtmlStyles}" />`
                    })
                    L.marker(coords, { icon }).addTo(map)
                     .bindPopup(`<strong style="font-weight: 700">{% if item.link %}<a href="{{ item.link }}">{% endif %}{{ item.name }}{% if item.link %}</a>{% endif %}</strong><p>{{ item.caption|default_if_none:"" }}</p>`);
                    bounds.extend(coords)
                {% elif item.shape == 'POLYLINE' %}
                    coords = {{ item.coordinates | safe }};
                    L.polyline(coords, {
                        color: '{{ item.color }}',
                        weight: 3,
                        opacity: 0.5,
                        smoothFactor: 1
                    }).addTo(map)
                      .bindPopup(`<strong style="font-weight: 700">{% if item.link %}<a href="{{ item.link }}">{% endif %}{{ item.name }}{% if item.link %}</a>{% endif %}</strong><p>{{ item.caption|default_if_none:"" }}</p>`);
                    coords.forEach(function (coord) {
                        bounds.extend(coord);
                    })
                {% elif item.shape == 'POLYGON' %}
                    coords = {{ item.coordinates | safe }};
                    L.polygon(coords, {
                        color: '{{ item.color }}',
                        weight: 3,
                        opacity: 0.5,
                        smoothFactor: 1
                    }).addTo(map)
                      .bindPopup(`<strong style="font-weight: 700">{% if item.link %}<a href="{{ item.link }}">{% endif %}{{ item.name }}{% if item.link %}</a>{% endif %}</strong><p>{{ item.caption|default_if_none:"" }}</p>`);
                    coords.forEach(function (coord) {
                        bounds.extend(coord);
                    })
                {% elif item.shape == 'CIRCLE' %}
                    coords = {{ item.coordinates | safe }};
                    shape = L.circle([coords.lat, coords.lng], {
                        radius: coords.radius,
                        color: '{{ item.color }}',
                        weight: 3,
                        opacity: 0.5,
                        smoothFactor: 1
                    })
                    shape.addTo(map)
                         .bindPopup(`<strong style="font-weight: 700">{% if item.link %}<a href="{{ item.link }}">{% endif %}{{ item.name }}{% if item.link %}</a>{% endif %}</strong><p>{{ item.caption|default_if_none:"" }}</p>`);
                    bounds.extend(shape.getBounds());
                {% endif %}
            {% endfor %}
    
            map.fitBounds(bounds);
    
            const resizeObserver = new ResizeObserver(() => {
                map.invalidateSize();
                map.fitBounds(bounds);
            });
            resizeObserver.observe(document.getElementById('map{{ obj.id }}'));
        })()
        
    </script>
</div>{% endraw %}
