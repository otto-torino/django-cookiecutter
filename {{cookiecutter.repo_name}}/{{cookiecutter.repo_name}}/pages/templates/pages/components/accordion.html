{% load static components %}

<details
    id="{{ attributes.id }}"
    class="group border-t border-gray-200 {% if not attributes.no_margin %}mt-2{% endif %}"
    {% if attributes.bg %} style="background-color: {{ attributes.bg }}"{% endif %}
    {% if not attributes.collapsed %}open{% endif %}>
    
    <summary class="flex w-full cursor-pointer items-center justify-between list-none py-4 text-left">
        <span class="text-base font-semibold">{{ attributes.name }}</span>
        <span class="rotate-[-180deg] transform transition-transform duration-200 ease-in-out group-open:rotate-0 motion-reduce:transition-none [&>svg]:h-8 [&>svg]:w-8">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
            </svg>
        </span>
    </summary>
    
    <div class="pb-4">
        {% render_slot slots.inner_block %}
    </div>

</details>
