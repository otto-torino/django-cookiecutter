{% raw %}{% load  static components %}
                    
<div id="{{ attributes.id }}" class="{% if not attributes.no_margin %}mt-2{% endif %}">
    <div class="border-t border-gray-200"{% if attributes.bg %} style="background-color: {{ attributes.bg }}"{% endif %}>
        <h2 class="mb-0" id="pageBlockHeading{{ attributes.id }}">
            <button
                class="relative flex w-full items-center justify-between border-0 py-4 text-left transition"
                type="button" 
                onclick="document.getElementById('collapse{{ attributes.id }}').classList.toggle('hidden'); document.getElementById('accordionChevron{{ attributes.id }}').classList.toggle('rotate-0')">
                    {{ attributes.name }}
                <span
                    id="accordionChevron{{ attributes.id }}"
                    class="rotate-[-180deg] transition-transform duration-200 ease-in-out group-data-[twe-collapse-collapsed]:me-0 motion-reduce:transition-none [&>svg]:h-8 [&>svg]:w-8">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                    </svg>
                </span>
            </button>
        </h2>
        <div 
            id="collapse{{ attributes.id }}" 
            class="!visible{% if attributes.collapsed %} hidden{% endif %}">
            <div>
                {% render_slot slots.inner_block %}
            </div>
        </div>
    </div>
</div>{% endraw %}
